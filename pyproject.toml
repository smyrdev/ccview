[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-jsonl-viewer"
version = "0.1.0"
description = "Simple, fast terminal & forensic CLI viewer for Claude Code .jsonl session logs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
ccview = "jsonl_viewer.cli:main"
