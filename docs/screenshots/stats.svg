  <circle cx="22" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="19" r="6" fill="#27c93f"/>
  <text x="460" y="24" text-anchor="middle" class="txt dim">ccview stats — Forensic Token Flame Chart &amp; Tool Latency</text>

