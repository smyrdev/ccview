  <text x="36" y="342" class="txt">  <tspan class="white">#4</tspan>   <tspan class="green">████████</tspan><tspan class="cyan">▒</tspan><tspan class="magenta">░</tspan>                           1.4k      55       <tspan class="green">86%</tspan>   <tspan class="green">$0.0005</tspan>    <tspan class="yellow">Grep</tspan></text>
  <text x="36" y="362" class="txt">  <tspan class="white">#5</tspan>   <tspan class="green">████████████████████████████</tspan><tspan class="yellow">▓</tspan><tspan class="cyan">▒▒</tspan><tspan class="magenta">░</tspan>     4.6k      90       <tspan class="green">91%</tspan>   <tspan class="green">$0.0040</tspan>    <tspan class="yellow">Bash</tspan></text>
  <text x="36" y="382" class="txt">  <tspan class="white">#6</tspan>   <tspan class="green">█████████████████████████████</tspan><tspan class="yellow">▓</tspan><tspan class="cyan">▒</tspan><tspan class="magenta">░</tspan>     4.7k     110       <tspan class="green">94%</tspan>   <tspan class="green">$0.0039</tspan>    <tspan class="yellow">-</tspan></text>

