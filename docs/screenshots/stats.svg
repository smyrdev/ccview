  <line x1="28" y1="98" x2="892" y2="98" class="rule"/>
  <text x="36" y="118" class="txt"><tspan class="bold">Cache Read Input (Hits)</tspan>          13,450               68.2%            <tspan class="green">$0.0040</tspan></text>
  <text x="36" y="138" class="txt"><tspan class="bold">Cache Creation Input (Writes)</tspan>     4,220               21.4%            <tspan class="green">$0.0158</tspan></text>
