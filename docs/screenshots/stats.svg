<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 10px; ry: 10px; stroke: #30363d; stroke-width: 1.5; }
      .header-bar { fill: #161b22; }
      .txt { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; font-size: 13px; fill: #e6edf3; white-space: pre; }
      .bold { font-weight: 700; }
      .dim { fill: #7d8590; }
      .cyan { fill: #39c5cf; }
      .bcyan { fill: #56d4dd; font-weight: 700; }
      .green { fill: #3fb950; }
      .bgreen { fill: #56d364; font-weight: 700; }
      .yellow { fill: #d29922; }
      .byellow { fill: #e3b341; font-weight: 700; }
      .magenta { fill: #bc8cff; }
      .bmagenta { fill: #d2a8ff; font-weight: 700; }
      .white { fill: #ffffff; font-weight: 700; }
      .rule { stroke: #30363d; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Terminal Window Frame -->
  <rect class="bg" x="2" y="2" width="916" height="556" rx="10" ry="10"/>
